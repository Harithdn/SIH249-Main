databases:
  - name: aerosentinel-db
    plan: free
    databaseName: aerosentinel

services:
  - type: web
    name: aerosentinel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: aerosentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set to the frontend's URL after first deploy (no trailing slash)
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: aerosentinel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the backend's URL after first deploy (no trailing slash)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
